name: Bug report
description: Report a reproducible problem with Decky WhatsApp
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include WhatsApp session files, bridge tokens, QR codes, private messages, or personal contact information.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reproduces the problem.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include Decky WhatsApp, Node.js, SteamOS, and Decky Loader versions where relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, session data, message content, names, phone numbers, and other private information first.
      render: text
