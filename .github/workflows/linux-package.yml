name: PC companion packages

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-companion-packages:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run bridge tests and typecheck
        run: |
          npm test
          npm run typecheck

      - name: Run voice failure redaction test
        working-directory: decky-plugin
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Check Linux shell scripts
        run: |
          bash -n install-decky-whatsapp-linux.sh
          bash -n start-decky-whatsapp-linux.sh
          bash -n keep-ssh-tunnel.sh
          bash -n scripts/package-linux.sh
          bash -n install-whisper-deck.sh

      - name: Check Python package builder
        run: python3 -m py_compile scripts/package-companions.py

      - name: Build and inspect both companion ZIPs
        run: |
          output="$RUNNER_TEMP/decky-whatsapp-pc-companions"
          mkdir -p "$output"
          python3 scripts/package-companions.py --platform all --output-dir "$output"
          version="$(node -p 'require("./package.json").version')"
          windows_zip="$output/decky-whatsapp-pc-windows-v${version}.zip"
          linux_zip="$output/decky-whatsapp-pc-linux-v${version}.zip"
          python3 -m zipfile -t "$windows_zip"
          python3 -m zipfile -t "$linux_zip"
          python3 - "$windows_zip" "$linux_zip" <<'PY'
          import re
          import sys
          import zipfile

          forbidden = re.compile(r"(^|/)(node_modules|\.wwebjs_auth[^/]*|\.wwebjs_cache[^/]*)(/|$)|(^|/)\.env(?!\.example(?:/|$))[^/]*(/|$)|(^|/)(bridge-token[^/]*|[^/]*\.token|[^/]*\.log(?:\.[^/]*)?)$")
          for path in sys.argv[1:]:
              with zipfile.ZipFile(path) as archive:
                  names = archive.namelist()
                  if any(forbidden.search(name) for name in names):
                      raise SystemExit(f"Forbidden private/generated path found in {path}")
                  if "pc-linux" in path:
                      required = [name for name in names if name.endswith(("install-decky-whatsapp-linux.sh", "start-decky-whatsapp-linux.sh", "keep-ssh-tunnel.sh"))]
                      if len(required) != 3 or any(not ((archive.getinfo(name).external_attr >> 16) & 0o111) for name in required):
                          raise SystemExit("Linux launcher scripts must retain executable bits in the ZIP")
          PY

      - name: Upload companion ZIPs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: decky-whatsapp-pc-companions-${{ github.run_id }}
          path: ${{ runner.temp }}/decky-whatsapp-pc-companions/*.zip
          if-no-files-found: error
          retention-days: 14

  attach-companion-zips-to-release:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build-companion-packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the published release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate release tag against package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [[ "$RELEASE_TAG" != "$version" && "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag '$RELEASE_TAG' does not match package version '$version'." >&2
            exit 1
          fi

      - name: Download this run's companion package artifacts
        uses: actions/download-artifact@v4
        with:
          name: decky-whatsapp-pc-companions-${{ github.run_id }}
          path: ${{ runner.temp }}/linux-release-asset

      - name: Attach both companion ZIPs without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          windows_name="decky-whatsapp-pc-windows-v${version}.zip"
          linux_name="decky-whatsapp-pc-linux-v${version}.zip"
          windows_path="$RUNNER_TEMP/linux-release-asset/$windows_name"
          linux_path="$RUNNER_TEMP/linux-release-asset/$linux_name"
          for asset_path in "$windows_path" "$linux_path"; do
            if [[ ! -f "$asset_path" ]]; then
              echo "Expected package artifact is missing: $(basename "$asset_path")" >&2
              exit 1
            fi
          done

          existing_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for asset_name in "$windows_name" "$linux_name"; do
            if grep -Fxq "$asset_name" <<< "$existing_assets"; then
              echo "Release asset already exists; refusing to replace it: $asset_name" >&2
              exit 1
            fi
          done

          gh release upload "$RELEASE_TAG" "$windows_path" "$linux_path"
